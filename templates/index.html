<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS & Call Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #1a1f3a 0%, #0a0d1a 60%);
    color: #e8ecff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: rgba(20, 26, 48, 0.85);
    border: 1px solid rgba(120, 140, 255, 0.25);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(14px);
  }
  .logo h1 {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    text-align: center;
    color: #8b95c9;
    font-size: 13px;
    margin-bottom: 28px;
    letter-spacing: 1px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(52, 211, 153, 0.08);
    border: 1px solid rgba(52, 211, 153, 0.3);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #6ee7b7;
    margin-bottom: 24px;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 10px #34d399;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  label {
    display: block;
    font-size: 12px;
    color: #8b95c9;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  textarea, input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 14px 16px;
    background: rgba(10, 13, 26, 0.8);
    border: 1px solid rgba(120, 140, 255, 0.25);
    border-radius: 12px;
    color: #e8ecff;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
    margin-bottom: 18px;
    font-family: 'Courier New', monospace;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    color: white;
    transition: 0.2s;
  }
  .btn-sms {
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
  }
  .btn-call {
    background: linear-gradient(90deg, #ef4444, #f97316);
    box-shadow: 0 10px 30px rgba(239, 68, 68, 0.35);
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    font-size: 14px;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .result.ok { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.4); color: #6ee7b7; display: block; }
  .result.err { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.4); color: #fca5a5; display: block; }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #4b5578; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><h1>SMS & CALL</h1></div>
    <div class="subtitle">Vietnam Spam Panel</div>

    <div class="status">
      <span class="dot"></span>
      <span>System Online</span>
    </div>

    {% if not authed %}
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="Nhập API Key để truy cập">
    <button class="btn-sms" onclick="unlock()">Unlock</button>
    {% else %}
    <label>Danh sách số (mỗi dòng một số)</label>
    <textarea id="numbers" placeholder="0987654321&#10;+84901234567"></textarea>

    <div class="row">
      <div>
        <label>Số luồng SMS</label>
        <input type="number" id="threadsSms" value="10" min="1" max="50">
      </div>
      <div>
        <label>Số luồng Call</label>
        <input type="number" id="threadsCall" value="5" min="1" max="30">
      </div>
    </div>

    <div class="row">
      <button class="btn-sms" id="btnSms" onclick="runSms()">SPAM SMS</button>
      <button class="btn-call" id="btnCall" onclick="runCall()">SPAM CALL</button>
    </div>

    <div class="result" id="result"></div>
    {% endif %}

    <div class="footer">© 2026 Spam Panel</div>
  </div>

<script>
const API_KEY = new URLSearchParams(location.search).get("key") || "";

function unlock() {
  const key = document.getElementById("apiKey").value.trim();
  if (!key) return alert("Nhập API Key!");
  location.href = "/?key=" + encodeURIComponent(key);
}

async function runSms() {
  const btn = document.getElementById("btnSms");
  const res = document.getElementById("result");
  const numbers = document.getElementById("numbers").value.trim();
  const threads = parseInt(document.getElementById("threadsSms").value) || 10;

  if (!numbers) { showErr("Nhập danh sách số!"); return; }
  btn.disabled = true; btn.textContent = "ĐANG GỬI...";
  res.className = "result"; res.style.display = "none";

  try {
    const r = await fetch("/sms", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ numbers, threads })
    });
    const data = await r.json();
    if (r.ok && data.success) showOk("✅ Đã chạy SMS spam cho " + data.count + " số.");
    else showErr("❌ " + (data.error || "Lỗi không xác định"));
  } catch (e) { showErr("❌ " + e.message); }
  finally { btn.disabled = false; btn.textContent = "SPAM SMS"; }
}

async function runCall() {
  const btn = document.getElementById("btnCall");
  const res = document.getElementById("result");
  const numbers = document.getElementById("numbers").value.trim();
  const threads = parseInt(document.getElementById("threadsCall").value) || 5;

  if (!numbers) { showErr("Nhập danh sách số!"); return; }
  btn.disabled = true; btn.textContent = "ĐANG GỌI...";
  res.className = "result"; res.style.display = "none";

  try {
    const r = await fetch("/call", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ numbers, threads })
    });
    const data = await r.json();
    if (r.ok && data.success) showOk("✅ Đã chạy Call spam cho " + data.count + " số.");
    else showErr("❌ " + (data.error || "Lỗi không xác định"));
  } catch (e) { showErr("❌ " + e.message); }
  finally { btn.disabled = false; btn.textContent = "SPAM CALL"; }
}

function showOk(msg) {
  const res = document.getElementById("result");
  res.className = "result ok"; res.textContent = msg;
}
function showErr(msg) {
  const res = document.getElementById("result");
  res.className = "result err"; res.textContent = msg;
}
</script>
</body>
</html>
